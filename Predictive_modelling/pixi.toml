[workspace]
name = "prime-deletions-figure2"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.8.20.*"
# Reticulate invokes a Conda-compatible runner when Python is supplied by Pixi.
micromamba = "2.*"
r-base = "4.4.*"
r-ggplot2 = "3.5.2.*"
r-reticulate = ">=1.44,<2"
r-egg = "0.4.5.*"
r-jsonlite = "1.8.*"

[pypi-dependencies]
numpy = "==1.24.4"
pandas = "==2.0.3"
xgboost = "==2.0.3"
scipy = "==1.10.1"
scikit-learn = "==1.3.2"
matplotlib = "==3.7.3"
shap = "==0.44.1"

[tasks]
reproduce = "Rscript run.R"
train = "python model.py train"
prepare = "python model.py prepare"
